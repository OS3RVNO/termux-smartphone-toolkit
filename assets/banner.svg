<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Termux Smartphone Toolkit</title>
  <desc id="description">Dark terminal-inspired banner with green and cyan accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110d"/>
      <stop offset="0.55" stop-color="#0b1c1b"/>
      <stop offset="1" stop-color="#07121d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53f27c"/>
      <stop offset="1" stop-color="#3de3e6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <path d="M0 58H1200M0 242H1200" stroke="#183c32" stroke-width="2" opacity="0.7"/>
  <circle cx="55" cy="42" r="7" fill="#ff5f57"/>
  <circle cx="80" cy="42" r="7" fill="#febc2e"/>
  <circle cx="105" cy="42" r="7" fill="#28c840"/>

  <g opacity="0.16" stroke="#53f27c">
    <path d="M60 90H330M60 115H250M920 185H1130M980 210H1130"/>
    <path d="M1030 80V150M1055 80V135M1080 80V165M1105 80V125"/>
  </g>

  <text x="70" y="135" fill="#53f27c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700" filter="url(#glow)">╭─ TERMUX</text>
  <text x="70" y="190" fill="url(#accent)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54" font-weight="800">SMARTPHONE TOOLKIT</text>
  <text x="74" y="230" fill="#b6d8cb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">Android automation · Zsh · X11 · Debian PRoot</text>
  <text x="1085" y="263" fill="#53f27c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">v3.0 ❯</text>

  <rect x="24" y="18" width="1152" height="264" rx="17" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.55"/>
</svg>
